<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Invitaciones | Chacón Beaterio</title>
    
    <!-- FUENTES PREMIUM -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Marcellus&display=swap" rel="stylesheet">
    
    <!-- CONEXIÓN TAILWIND (Vía CDN para que no falle nunca) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background-color: #120e0c; color: #E6D5B8; font-family: 'EB Garamond', serif; }
        
        .btn-action { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .btn-action:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(218, 165, 32, 0.4); }
        .btn-action:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .input-colonial {
            background-color: rgba(0,0,0,0.6);
            border: 1px solid #8C92AC;
            color: #E6D5B8;
            transition: all 0.3s;
        }
        .input-colonial:focus { border-color: #DAA520; outline: none; box-shadow: 0 0 10px rgba(218,165,32,0.2); }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #DAA520; cursor: pointer; margin-top: -6px; box-shadow: 0 0 5px rgba(218, 165, 32, 0.8); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(140, 146, 172, 0.3); border-radius: 2px; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #120e0c; }
        ::-webkit-scrollbar-thumb { background: #B89947; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #DAA520; }
    </style>
</head>

<body class="min-h-screen flex flex-col md:flex-row bg-[#120e0c]">

    <div class="w-full md:w-1/3 lg:w-[30%] p-6 bg-[#1c1613] border-r border-[#B89947]/30 flex flex-col min-h-screen shadow-[10px_0_30px_rgba(0,0,0,0.8)] z-10 relative overflow-y-auto">
        
        <a href="index.html" class="font-romana text-xs text-[#8C92AC] hover:text-[#DAA520] transition uppercase mb-4 inline-block">← Volver a la Web</a>

        <div class="text-center mb-8 mt-2">
            <h1 class="font-romana text-3xl text-[#DAA520] mb-1 tracking-wide">Generador</h1>
            <h2 class="font-romana text-xs text-[#8C92AC] uppercase tracking-[0.2em]">Chacón Beaterio</h2>
            <div class="w-12 h-px bg-[#DAA520] mx-auto mt-4"></div>
        </div>

        <div class="space-y-8 flex-1">
            
            <div>
                <label class="block text-xs font-romana text-[#DAA520] uppercase tracking-widest mb-3">1. Elige una Plantilla</label>
                <div class="flex gap-2 mb-4">
                    <button onclick="setTemplate(FONDOS.fondo1)" class="flex-1 aspect-[9/16] bg-black rounded-sm border border-[#B89947]/50 hover:border-[#DAA520] focus:border-[#DAA520] bg-[length:100%_100%] bg-center overflow-hidden flex items-end justify-center pb-2 transition-colors" style="background-image: url('https://i.imgur.com/uDJ3xLD.png');" title="Fondo Oficial">
                        <span class="text-[10px] text-[#E6D5B8] bg-black/80 px-2 py-1 rounded font-romana uppercase">Oficial</span>
                    </button>
                    <button onclick="setTemplate(FONDOS.fondo2)" class="flex-1 aspect-[9/16] bg-black rounded-sm border border-[#B89947]/50 hover:border-[#DAA520] focus:border-[#DAA520] bg-[length:100%_100%] bg-center overflow-hidden flex items-end justify-center pb-2 transition-colors" style="background-image: url('https://placehold.co/1080x1920/261f1a/E6D5B8?text=Diseño+2');" title="Opción 2">
                        <span class="text-[10px] text-[#E6D5B8] bg-black/80 px-2 py-1 rounded font-romana uppercase">Opción 2</span>
                    </button>
                    <button onclick="setTemplate(FONDOS.fondo3)" class="flex-1 aspect-[9/16] bg-black rounded-sm border border-[#B89947]/50 hover:border-[#DAA520] focus:border-[#DAA520] bg-[length:100%_100%] bg-center overflow-hidden flex items-end justify-center pb-2 transition-colors" style="background-image: url('https://placehold.co/1080x1920/0a0807/8C92AC?text=Diseño+3');" title="Opción 3">
                        <span class="text-[10px] text-[#E6D5B8] bg-black/80 px-2 py-1 rounded font-romana uppercase">Opción 3</span>
                    </button>
                </div>
            </div>

            <div class="relative">
                <label for="invitadoName" class="block text-xs font-romana text-[#DAA520] mb-2 uppercase tracking-widest">2. Nombre del Invitado</label>
                <input type="text" id="invitadoName" placeholder="EJ. JOSÉ VIZCARRA" 
                    class="w-full bg-black/60 border border-[#B89947]/50 rounded-sm px-4 py-3 text-[#E6D5B8] placeholder-[#8C92AC]/50 focus:outline-none focus:border-[#DAA520] transition-colors text-lg font-romana uppercase text-center"
                    oninput="updateName()">
            </div>

            <div class="relative bg-black/30 p-4 rounded-sm border border-[#B89947]/20">
                <div class="flex justify-between items-center mb-3">
                    <label class="block text-xs font-romana text-[#DAA520] uppercase tracking-widest mb-0">3. Pie de Página</label>
                    <button onclick="randomizeVerse()" class="bg-[#B89947]/20 text-[#DAA520] px-2 py-1 rounded-sm text-[10px] font-romana hover:bg-[#B89947] hover:text-black transition-colors border border-[#B89947]/50 flex items-center gap-1 uppercase tracking-wider">
                        Aleatorio ↻
                    </button>
                </div>
                <textarea id="verseInput" rows="3" class="w-full bg-black/60 border border-[#8C92AC]/30 rounded-sm px-3 py-3 text-[#E6D5B8] text-sm font-lectura italic resize-none focus:outline-none focus:border-[#DAA520] transition-colors text-center" oninput="updateVerse()"></textarea>
            </div>

            <div class="bg-black/40 p-5 rounded-sm border border-[#B89947]/20 space-y-5">
                <h3 class="text-[10px] text-[#8C92AC] uppercase tracking-widest text-center mb-4 border-b border-white/5 pb-2">Ajustes del Nombre</h3>
                <div>
                    <div class="flex justify-between text-xs font-romana text-[#E6D5B8] mb-2"><span>Posición (Arriba/Abajo)</span><span id="valY" class="text-[#DAA520]">50.8%</span></div>
                    <input type="range" id="posY" min="10" max="90" step="0.1" value="50.8" oninput="updateStyles()">
                </div>
                <div>
                    <div class="flex justify-between text-xs font-romana text-[#E6D5B8] mb-2"><span>Tamaño de Letra</span><span id="valSize" class="text-[#DAA520]">151%</span></div>
                    <input type="range" id="textSize" min="50" max="250" value="151" oninput="updateStyles()">
                </div>
                <div class="flex items-center justify-between border-b border-white/5 pb-4">
                    <span class="text-xs font-romana text-[#E6D5B8] uppercase">Color del Nombre</span>
                    <input type="color" id="textColor" value="#000000" class="w-8 h-8 rounded-sm cursor-pointer border border-[#B89947] bg-transparent" oninput="updateStyles()">
                </div>

                <h3 class="text-[10px] text-[#8C92AC] uppercase tracking-widest text-center mt-4 mb-4 border-b border-white/5 pb-2 pt-2">Ajustes del Mensaje</h3>
                <div>
                    <div class="flex justify-between text-xs font-romana text-[#E6D5B8] mb-2"><span>Posición (Arriba/Abajo)</span><span id="valVerseY" class="text-[#DAA520]">96.7%</span></div>
                    <input type="range" id="verseY" min="50" max="98" step="0.1" value="96.7" oninput="updateStyles()">
                </div>
                <div>
                    <div class="flex justify-between text-xs font-romana text-[#E6D5B8] mb-2"><span>Tamaño de Letra</span><span id="valVerseSize" class="text-[#DAA520]">63%</span></div>
                    <input type="range" id="verseSize" min="30" max="200" value="63" oninput="updateStyles()">
                </div>
            </div>
            
            <div class="pt-6 mt-auto border-t border-[#B89947]/30">
                <div class="flex flex-col gap-4">
                    <button id="btnDownload" onclick="handleAction('download')" class="btn-action w-full flex items-center justify-center gap-3 bg-gradient-to-b from-[#DAA520] to-[#B89947] text-black font-romana font-bold py-4 px-4 rounded-sm uppercase tracking-widest text-sm shadow-[0_4px_10px_rgba(0,0,0,0.5)]">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                        Descargar Invitación
                    </button>
                    
                    <button id="btnWhatsApp" onclick="handleAction('whatsapp')" class="btn-action w-full flex items-center justify-center gap-3 bg-[#128C7E]/10 border border-[#128C7E] text-[#25D366] hover:bg-[#128C7E] hover:text-white font-romana font-bold py-4 px-4 rounded-sm uppercase tracking-widest text-sm shadow-lg transition-all duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                        Compartir a WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="w-full md:w-2/3 lg:w-[70%] flex-1 flex flex-col items-center justify-center p-4 md:p-10 bg-black/50 overflow-y-auto relative">
        <div class="absolute top-6 border border-[#B89947]/50 bg-black/80 backdrop-blur-sm rounded-full px-6 py-2 flex items-center gap-3 shadow-2xl z-20">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#DAA520] opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-[#DAA520]"></span>
            </span>
            <p class="text-[#DAA520] font-romana text-xs tracking-[0.2em] uppercase">Vista Previa - Formato Historia</p>
        </div>
        
        <div id="preview-wrapper" class="relative origin-top transition-transform duration-200 shadow-[0_20px_50px_rgba(0,0,0,0.9)] border border-[#B89947]/20 mt-12" style="width: 337px; height: 600px;">
            <div id="invitation-preview" class="absolute top-0 left-0 overflow-hidden bg-center bg-[length:100%_100%] bg-no-repeat bg-[#1a1512]" style="width: 1080px; height: 1920px; background-image: url('https://i.imgur.com/uDJ3xLD.png'); transform-origin: top left;">
                
                <div id="name-container" class="absolute w-full px-[80px] text-center" style="top: 50.8%;">
                    <p id="display-name" class="font-romana font-bold break-words inline-block m-0" style="color: #000000; line-height: 1;">
                        <span class="opacity-40">NOMBRE INVITADO</span>
                    </p>
                </div>
                
                <div id="verse-container" class="absolute w-full px-[100px] text-center" style="top: 96.7%;">
                    <p id="display-verse" class="font-lectura italic font-medium break-words drop-shadow-[0_4px_8px_rgba(0,0,0,0.9)] inline-block m-0" style="color: #E6D5B8; line-height: 1;">
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 bg-[#7B1E22] border border-[#B89947] text-[#E6D5B8] px-8 py-4 rounded-sm shadow-[0_10px_30px_rgba(0,0,0,0.8)] transition-all duration-500 z-[200] flex items-center gap-4 min-w-[320px] font-romana uppercase tracking-widest text-xs">
        <span class="text-[#DAA520] text-xl">✧</span>
        <p id="toast-message" class="flex-1 text-center font-bold">Mensaje</p>
        <span class="text-[#DAA520] text-xl">✧</span>
    </div>

    <script>
        const FONDOS = {
            fondo1: "https://i.imgur.com/uDJ3xLD.png",
            fondo2: "https://placehold.co/1080x1920/261f1a/E6D5B8?text=Diseño+2",
            fondo3: "https://placehold.co/1080x1920/0a0807/8C92AC?text=Diseño+3"
        };

        const frases = [
            '"Danzando con profunda devoción al Milagroso Niño Jesús desde 1932."',
            '"Tradición, Fe y Cultura. Guardianes de la herencia huanuqueña."',
            '"Que la bendición del Milagroso Niño Jesús ilumine siempre a tu familia."',
            '"Con el paso firme de los Caporales y la alegría de los Corochanos, celebramos nuestra fe."',
            '"94 años de ininterrumpida devoción. ¡Te esperamos!"',
            '"Nuestra danza es oración, nuestra música es alabanza al Niño Jesús."'
        ];

        window.onload = () => {
            randomizeVerse();
            setTemplate(FONDOS.fondo1);
            
            document.getElementById('posY').value = 50.8;
            document.getElementById('textSize').value = 151;
            document.getElementById('textColor').value = "#000000";
            document.getElementById('verseY').value = 96.7;
            document.getElementById('verseSize').value = 63;
            
            updateStyles();
            scalePreview(); 
            window.addEventListener('resize', scalePreview);
        };

        function scalePreview() {
            const wrapper = document.getElementById('preview-wrapper');
            const preview = document.getElementById('invitation-preview');
            const rightPanel = wrapper.parentElement;
            if (!wrapper || !preview || !rightPanel) return;
            
            // Ocupará como máximo el 70% del alto de la pantalla o un máximo de 600px en PC
            let maxHeight = rightPanel.clientHeight * 0.70; 
            if (maxHeight > 600) maxHeight = 600; 
            
            const maxWidth = rightPanel.clientWidth - 40;
            let targetWidth = maxHeight * (1080 / 1920);
            
            if (targetWidth > maxWidth) {
                targetWidth = maxWidth;
            }
            
            const scale = targetWidth / 1080;
            preview.style.transform = `scale(${scale})`;
            wrapper.style.width = `${targetWidth}px`;
            wrapper.style.height = `${1920 * scale}px`; 
        }

        function setTemplate(bgUrl) { document.getElementById('invitation-preview').style.backgroundImage = `url('${bgUrl}')`; }
        function randomizeVerse() { document.getElementById('verseInput').value = frases[Math.floor(Math.random() * frases.length)]; updateVerse(); }
        function updateVerse() { document.getElementById('display-verse').innerText = document.getElementById('verseInput').value; }
        
        function updateName() {
            const inputName = document.getElementById('invitadoName').value;
            const displayElement = document.getElementById('display-name');
            if (inputName.trim() === '') displayElement.innerHTML = '<span class="opacity-40">NOMBRE INVITADO</span>';
            else displayElement.innerText = inputName.toUpperCase(); 
        }

        function updateStyles() {
            const posY = parseFloat(document.getElementById('posY').value);
            const sizePercent = parseFloat(document.getElementById('textSize').value);
            const color = document.getElementById('textColor').value;
            const verseY = parseFloat(document.getElementById('verseY').value);
            const verseSizePercent = parseFloat(document.getElementById('verseSize').value);
            
            document.getElementById('valY').innerText = posY.toFixed(1) + '%';
            document.getElementById('valSize').innerText = sizePercent + '%';
            document.getElementById('valVerseY').innerText = verseY.toFixed(1) + '%';
            document.getElementById('valVerseSize').innerText = verseSizePercent + '%';

            const exactNameTop = 1920 * (posY / 100);
            const exactVerseTop = 1920 * (verseY / 100);
            const finalNameSize = 52 * (sizePercent / 100);
            const finalVerseSize = 38 * (verseSizePercent / 100);

            const container = document.getElementById('name-container');
            const text = document.getElementById('display-name');
            container.style.top = exactNameTop + 'px';
            text.style.color = color;
            text.style.fontSize = finalNameSize + 'px'; 
            text.style.lineHeight = finalNameSize + 'px'; 
            
            const vContainer = document.getElementById('verse-container');
            const vText = document.getElementById('display-verse');
            vContainer.style.top = exactVerseTop + 'px';
            vText.style.fontSize = finalVerseSize + 'px';
            vText.style.lineHeight = (finalVerseSize * 1.2) + 'px';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0'); }, 4000);
        }

        async function handleAction(actionType) {
            const inputName = document.getElementById('invitadoName').value;
            if (inputName.trim() === '') {
                showToast("Por favor, ingresa el nombre de tu invitado.");
                document.getElementById('invitadoName').focus();
                return;
            }

            const btn = document.getElementById(actionType === 'download' ? 'btnDownload' : 'btnWhatsApp');
            const originalContent = btn.innerHTML;
            btn.innerHTML = 'PROCESANDO...';
            btn.disabled = true;

            try {
                const imageBlob = await generateHighResImage();
                const safeName = inputName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                const fileName = `Invitacion_ChaconBeaterio_${safeName}.jpg`;

                if (actionType === 'download') {
                    triggerDownload(imageBlob, fileName);
                    showToast("¡Invitación descargada exitosamente!");
                } 
                else if (actionType === 'whatsapp') {
                    const file = new File([imageBlob], fileName, { type: 'image/jpeg' });
                    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                    const pageUrl = "https://tu-pagina-en-vercel.vercel.app"; 
                    const shareText = `¡Estás invitado! 🎉 Te comparto mi invitación oficial para participar de las festividades de la Cofradía de Negritos Chacón Beaterio. 🕺✨\n\nCrea tu propia invitación personalizada y únete a nuestra devoción aquí: ${pageUrl}`;
                    
                    if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: 'Invitación Chacón Beaterio', text: shareText });
                    } else {
                        triggerDownload(imageBlob, fileName);
                        showToast("Descargando foto y abriendo WhatsApp Web...");
                        setTimeout(() => {
                            const encodedText = encodeURIComponent(shareText + "\n\n(Por favor, adjunta la invitación que se acaba de descargar)");
                            window.open(`https://web.whatsapp.com/send?text=${encodedText}`, '_blank');
                        }, 1500);
                    }
                }
            } catch (error) {
                console.error("Error al generar la imagen:", error);
                showToast("La descarga funcionará perfectamente al subirlo a Vercel.");
            } finally {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        }

        function triggerDownload(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = fileName;
            link.href = url;
            link.click();
            URL.revokeObjectURL(url);
        }

        async function generateHighResImage() {
            return new Promise(async (resolve, reject) => {
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 1080;
                    canvas.height = 1920;
                    const ctx = canvas.getContext('2d');

                    const preview = document.getElementById('invitation-preview');
                    let bgUrl = preview.style.backgroundImage;
                    bgUrl = bgUrl.replace(/^url\(["']?/, '').replace(/["']?\)$/, ''); 

                    const img = new Image();
                    img.crossOrigin = "anonymous";
                    img.src = bgUrl + "?v=1";

                    img.onload = async () => {
                        ctx.drawImage(img, 0, 0, 1080, 1920);
                        await document.fonts.ready;

                        const nameText = document.getElementById('display-name').innerText.trim();
                        const posY = parseFloat(document.getElementById('posY').value); 
                        const sizePercent = parseFloat(document.getElementById('textSize').value);
                        const color = document.getElementById('textColor').value;
                        
                        const exactNameTop = 1920 * (posY / 100);
                        const finalNameSize = 52 * (sizePercent / 100);

                        ctx.textAlign = "center";
                        ctx.textBaseline = "top"; 
                        ctx.font = `bold ${finalNameSize}px 'Marcellus'`;
                        ctx.fillStyle = color;
                        
                        if (color === "#000000") {
                            ctx.shadowColor = "rgba(255, 255, 255, 0.4)";
                            ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 1; ctx.shadowBlur = 3;
                        } else {
                            ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
                            ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 4; ctx.shadowBlur = 8;
                        }
                        
                        ctx.fillText(nameText, 540, exactNameTop);

                        const verseText = document.getElementById('display-verse').innerText;
                        const verseY = parseFloat(document.getElementById('verseY').value);
                        const verseSizePercent = parseFloat(document.getElementById('verseSize').value);
                        
                        const exactVerseTop = 1920 * (verseY / 100);
                        const finalVerseSize = 38 * (verseSizePercent / 100);

                        ctx.font = `italic 500 ${finalVerseSize}px 'EB Garamond'`;
                        ctx.fillStyle = "#E6D5B8";
                        ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
                        ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 4; ctx.shadowBlur = 8;

                        const maxWidth = 1080 - (100 * 2); 
                        const lineHeight = finalVerseSize * 1.2;
                        wrapText(ctx, verseText, 540, exactVerseTop, maxWidth, lineHeight);

                        canvas.toBlob((blob) => { resolve(blob); }, 'image/jpeg', 0.95);
                    };
                    img.onerror = () => { reject(new Error("Error de permisos de imagen")); };
                } catch (error) { reject(error); }
            });
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    context.fillText(line.trim(), x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else { line = testLine; }
            }
            context.fillText(line.trim(), x, currentY);
        }
    </script>
</body>
